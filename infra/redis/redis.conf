# ─────────────────────────────────────────────────────────────────────────────
# Redis configuration for PRAVAAH
# ─────────────────────────────────────────────────────────────────────────────

# Bind to all interfaces inside Docker
bind 0.0.0.0

# Password (set via env in docker-compose; this placeholder is overridden)
# requirepass CHANGE_ME

# Persistence: RDB snapshot every 60s if at least 1 key changed
save 60 1
save 300 10
save 900 100

# Max memory — adjust based on host RAM
maxmemory 256mb

# Eviction policy: LRU for general cache keys
maxmemory-policy allkeys-lru

# Log level
loglevel notice

# Slow query log (commands taking > 10ms)
slowlog-log-slower-than 10000
slowlog-max-len 128

# Disable protected mode (we're in a Docker network)
protected-mode no
